name: index
on:
  schedule: [{cron: "0 */2 * * *"}]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./gen-index.sh
        env: {GH_TOKEN: "${{ secrets.INDEX_PAT }}"}
      - run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add INDEX.md
          git diff --staged --quiet || git commit -m "update index"
          git push
